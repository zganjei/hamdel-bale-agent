name: Test and deploy Hamdel
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hamdel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q hamdel main.py agent_bridge.py multimodal.py media_reader.py
      - name: Check live Hamdel release (informational)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request

          try:
              req = urllib.request.Request('https://hamdel-reporter.liara.run/health', headers={'User-Agent':'hamdel-ci-health/1'})
              with urllib.request.urlopen(req, timeout=12) as response:
                  info = json.load(response)
              if not isinstance(info, dict):
                  raise ValueError('Invalid health response')
              for field in ('service', 'version', 'state', 'release'):
                  value = str(info.get(field, 'unknown'))[:100]
                  value = re.sub(r'[^a-zA-Z0-9_.:-]', '?', value)
                  print(f'Live {field}: {value}')
          except Exception as exc:
              print('Live health: unavailable (' + type(exc).__name__ + ')')
          PY
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      LIARA_API_TOKEN: ${{ secrets.LIARA_API_TOKEN }}
    steps:
      - name: Check deployment configuration
        id: config
        shell: bash
        run: |
          if [ -n "$LIARA_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Deployment blocked: missing LIARA_API_TOKEN in repository Actions secrets."
            echo "Deployment BLOCKED: add LIARA_API_TOKEN to Settings → Secrets and variables → Actions, then re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Install deployment CLI
        if: steps.config.outputs.enabled == 'true'
        run: npm install --global @liara/cli@9.5.1
      - name: Record source commit
        if: steps.config.outputs.enabled == 'true'
        run: python3 scripts/prepare_release.py "$GITHUB_SHA"
      - name: Deploy and verify the exact commit
        if: steps.config.outputs.enabled == 'true'
        run: python3 scripts/deploy.py
